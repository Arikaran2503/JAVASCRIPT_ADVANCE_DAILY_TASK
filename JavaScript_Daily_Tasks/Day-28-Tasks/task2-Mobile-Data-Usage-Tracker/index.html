<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Data Usage Tracker</title>
</head>
<body>
    <h1>Mobile Data Usage Tracker</h1>

    <label for="dataLimit">Daily Data Limit (GB):</label>
    <input type="number" id="dataLimit" placeholder="Example: 2" min="0.01" step="0.01">
    <br><br>

    <label for="dataUsed">Data Used Today (GB):</label>
    <input type="number" id="dataUsed" placeholder="Example: 0.5" min="0" step="0.01">
    <br><br>

    <button onclick="addUsage()">Add Usage</button>

    <h3>Today's Summary</h3>
    <p id="totalUsage">Total Used: 0 GB</p>
    <p id="remainingData">Remaining Data: 0 GB</p>
    <p id="usageStatus">Status: Not started</p>

    <h3>Usage History</h3>
    <ul id="usageHistory"></ul>

    <button onclick="resetUsage()">Reset Today's Usage</button>

    <script src="script.js"></script>
</body>
</html>
