<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Trip Expense Splitter</title>
</head>
<body>
    <h1>Group Trip Expense Splitter</h1>

    <h3>Add Trip Expense</h3>
    <label for="friendName">Friend Name:</label>
    <input type="text" id="friendName" placeholder="Enter friend name">
    <br><br>

    <label for="expenseAmount">Expense Amount:</label>
    <input type="number" id="expenseAmount" placeholder="Enter amount" min="0.01" step="0.01">
    <br><br>

    <button onclick="addExpense()">Add Expense</button>

    <h3>Trip Expenses</h3>
    <ul id="expenseList"></ul>

    <h3>Split Expenses</h3>
    <button onclick="calculateExpenses()">Calculate Share</button>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
