<!DOCTYPE html>
<html>
<head>
    <title>Employee Overtime Salary Calculator</title>
</head>
<body>

    <h2>Employee Overtime Salary Calculator</h2>

    <label>Enter Employee Name:</label>
    <input type="text" id="name">

    <br><br>

    <label>Enter Normal Working Hours:</label>
    <input type="number" id="hours">

    <br><br>

    <label>Enter Overtime Hours:</label>
    <input type="number" id="overtime">

    <br><br>

    <label>Enter Hourly Salary:</label>
    <input type="number" id="salary">

    <br><br>

    <button onclick="calculateSalary()">Calculate Salary</button>

    <h3 id="result"></h3>

    <script src="script.js"></script>
</body>
</html>
